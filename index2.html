<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>СтройКонтроль</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f1f4f8;font:16px Arial,sans-serif;color:#202d40}header{background:#213d6a;color:#fff;padding:26px 18px}h1{margin:0 0 10px;font-size:29px}main{max-width:750px;margin:auto;padding:16px}.card{background:white;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 3px 12px #0001}input,select,button{width:100%;padding:13px;margin:7px 0;border-radius:9px;font-size:16px;border:1px solid #c7d0dd}button{background:#3266b8;color:white;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.danger{background:#ae4646}.muted{color:#637084;font-size:14px}.object{border-top:1px solid #ddd;padding:15px 0}.error{color:#b32626;white-space:pre-wrap}.hidden{display:none}</style></head>
<body><header><h1>🏗️ СтройКонтроль</h1>Управление строительными объектами</header><main>
<section id="login" class="card"><h2>Вход для сотрудников</h2><input id="email" type="email" placeholder="Рабочая почта" autocomplete="email"><input id="password" type="password" placeholder="Пароль" autocomplete="current-password"><button id="signIn">Войти</button><p class="muted">Используйте учётную запись, созданную администратором в Supabase Authentication.</p><p id="loginMsg" class="error"></p></section>
<div id="app" class="hidden"><section class="card"><p id="who" class="muted"></p><button id="signOut">Выйти</button></section><section class="card"><h2>Мои объекты</h2><div id="objects">Загрузка...</div><p id="listMsg" class="error"></p></section><section class="card"><h2>Добавить объект</h2><input id="name" placeholder="Название объекта"><input id="address" placeholder="Адрес объекта"><label for="deadline">Срок завершения</label><input id="deadline" type="date"><select id="status"><option>Не начат</option><option>В работе</option><option>Приостановлен</option><option>Завершён</option></select><button id="add">Добавить объект</button><p id="addMsg" class="error"></p></section></div>
</main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const url='https://yshhzvcitpeszhavugzn.supabase.co';
const key='sb_publishable_geax2_1C3bA_i4AEDIs_kQ_GpUmOuVL';
const supabase=createClient(url,key);
const $=id=>document.getElementById(id);
let currentUser=null;
function message(id,text){$(id).textContent=text||''}
function errorText(e){return e?.message||'Неизвестная ошибка'}
async function refresh(){message('listMsg','');$('objects').textContent='Загрузка...';const {data,error}=await supabase.from('objects').select('id,name,address,deadline,status').order('id',{ascending:false});if(error){$('objects').textContent='';message('listMsg','Ошибка загрузки: '+errorText(error));return} $('objects').replaceChildren();if(!data.length){$('objects').textContent='Объекты пока не добавлены';return}for(const o of data){const wrap=document.createElement('div');wrap.className='object';const title=document.createElement('h3');title.textContent=o.name||'Без названия';const details=document.createElement('p');details.textContent=[o.address,o.status].filter(Boolean).join(' — ');const date=document.createElement('p');date.className='muted';date.textContent=o.deadline?'Срок: '+o.deadline:'Срок не указан';const del=document.createElement('button');del.className='danger';del.textContent='Удалить объект';del.onclick=async()=>{if(!confirm('Удалить объект «'+o.name+'»?'))return;del.disabled=true;const {error}=await supabase.from('objects').delete().eq('id',o.id);if(error){message('listMsg','Ошибка удаления: '+errorText(error));del.disabled=false}else await refresh()};wrap.append(title,details,date,del);$('objects').append(wrap)}}
async function showSession(){const {data:{user},error}=await supabase.auth.getUser();currentUser=error?null:user;if(!currentUser){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}const {data:admin,error:adminError}=await supabase.from('admins').select('user_id').eq('user_id',currentUser.id).maybeSingle();if(adminError||!admin){await supabase.auth.signOut();currentUser=null;$('login').classList.remove('hidden');$('app').classList.add('hidden');message('loginMsg',adminError?'Ошибка проверки доступа: '+errorText(adminError):'У этого аккаунта нет доступа. Обратитесь к администратору.');return}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='Вы вошли: '+currentUser.email;await refresh()}
$('signIn').onclick=async()=>{message('loginMsg','');$('signIn').disabled=true;try{const {error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await showSession()}catch(e){message('loginMsg',errorText(e))}finally{$('signIn').disabled=false}};
$('signOut').onclick=async()=>{await supabase.auth.signOut();await showSession()};
$('add').onclick=async()=>{message('addMsg','');const name=$('name').value.trim();if(!name){message('addMsg','Введите название объекта');return} $('add').disabled=true;try{const {error}=await supabase.from('objects').insert({name,address:$('address').value.trim()||null,deadline:$('deadline').value||null,status:$('status').value});if(error)throw error;$('name').value='';$('address').value='';$('deadline').value='';await refresh()}catch(e){message('addMsg','Ошибка сохранения: '+errorText(e))}finally{$('add').disabled=false}};
showSession();
</script></body></html>
